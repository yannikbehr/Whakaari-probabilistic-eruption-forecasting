[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/sandbox.ipynb",
    "/gessp-operational-stack.yml",
    "/Dockerfile"
    ]

[tool.hatch.build.targets.wheel]
packages = ["src/whakaaribn"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "whakaaribn"
requires-python = ">= 3.11"
version = "0.1.1"
authors = [
    {name = "Yannik Behr", email = "y.behr@gns.cri.nz"},
    {name = "Craig Miller", email = "c.miller@gns.cri.nz"},
    {name = "Annemarie Christophersen", email = "a.christophersen@gns.cri.nz"}
]
description = "Eruption forecasting for Whakaari/White Island using Bayesian Networks."

dependencies = [
    "cartopy>=0.25.0,<0.26",
    "ipykernel>=7.2.0,<8",
    "matplotlib>=3.10.8,<4",
    "numpy>=2.4.2,<3",
    "pandas>=3.0.1,<4",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.17.1,<2",
    "statsmodels>=0.14.6,<0.15",
    "tqdm>=4.67.3,<5",
    "nbformat>=5.10.4,<6",
    "nbconvert>=7.17.0,<8",
    "torch>=2.10.0,<3",
    "aitana>=0.1.11,<0.2",
    "snakemake>=9.16.3,<10",
    "tonik>=0.1.21,<0.2",
    "plotly>=6.5.2,<7",
    "kaleido>=1.2.0,<2",
    "papermill>=2.6.0,<3",
    "schedule>=1.2.2,<2",
    "owslib>=0.35.0,<0.36",
    "pgmpy @ git+https://github.com/yannikbehr/pgmpy.git@predict_probability_w_nans"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2,<10",
       "httpx>=0.28.1,<0.29",
       "ipdb>=0.13.13,<0.14",
       "hatch>=1.16.5,<2"]

[project.scripts]
whakaaribn_api = "whakaaribn.api:main"
whakaaribn = "whakaaribn.cli:main"

[tool.hatch.build]
include = ["src/whakaaribn/data/*.json",
           "src/whakaaribn/data/WhiteIs_Eruption_Catalogue.csv",
           "src/whakaaribn/data/271912_Brad_Scott_GNS_Science.jpg",
           "src/whakaaribn/data/workflows/Snakefile",
           "src/whakaaribn/data/workflows/notebooks/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true

[tool.ruff.lint]
unfixable = ["F401"]

[tool.hatch.envs.test]
dependencies = [
  "pytest",
  "httpx"
]
[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13"]

[tool.hatch.envs.test.scripts]
run-pytest = "pytest tests"