variables:
  IMAGE: "artifactory.gns.cri.nz/gns/whakaaribn-$CI_COMMIT_BRANCH"
  APP_NAME: "whakaaribn-$CI_COMMIT_BRANCH"
  API_APP_NAME: "whakaaribnAPI-$CI_COMMIT_BRANCH"
  APP_SERVER: "Vulkan"
  TEAM: "Volcano"
  API_PORT: "8049"
  GESSP_OP_UID: "1000"
  GESSP_OP_GID: "999"

stages:
  - build
  - test
  - deploy

build:
  tags:
    - linux
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: always 
  script:
    - DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile --target app -t "$IMAGE" .
    - docker image push "$IMAGE"

test:
  tags:
    - linux 
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always 
  script:
    - docker run --rm "$IMAGE" hatch run test:run-pytest 
  allow_failure: true

deploy-processing:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never 
    - when: always 
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX  
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["whakaaribn", "daemon", "--directory", "/home/bayes/data", "--cores", "4"],
      "HostConfig": {
        "RestartPolicy": { "Name": "always" },
        "Binds": ["whakaari_bn_data:/home/bayes/data"]
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "$APP_NAME" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

deploy-api:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never 
    - when: always 
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX  
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["whakaaribn_api", "--rootdir", "/home/bayes/data"],
      "HostConfig": {
        "PortBindings": { "8003/tcp": [{ "HostPort": "${API_PORT}" }] },
        "ExposedPorts": { "8003/tcp": {} },
        "RestartPolicy": { "Name": "always" },
        "Binds": ["whakaari_bn_data:/home/bayes/data"]
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "$API_APP_NAME" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

build-gessp-operational:
  tags:
    - linux
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
      - git clone "https://oauth2:$gitlabcicd@git.gns.cri.nz/applications/cicdutils.git"
  after_script:
      - rm -rf cicdutils
      - git clean -fdX
  script: |
    ./cicdutils/docker_build.sh -i "$IMAGE" -b "--build-arg D_UID=${GESSP_OP_UID} --build-arg D_GID=${GESSP_OP_GID}"

deploy-gessp-operational:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX  
  script: |
    export portainer_auth=$gessp_operational
    export GESSP_OP_UID=$GESSP_OP_UID
    export GESSP_OP_GID=$GESSP_OP_GID
    export API_PORT=$API_PORT
    export IMAGE=$IMAGE
    envsubst < gessp-operational-stack.yml > compose.yml
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py --update -s "GeSSP Operational" -t $TEAM -H "https://gessp.gns.cri.nz/portainer" --stack whakaaribn compose.yml  
