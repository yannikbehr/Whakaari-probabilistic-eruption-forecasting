version: '3.8'
services:
  whakaaribn:
    stop_grace_period: 60s
    deploy:
      update_config:
        order: start-first   
    image: ${IMAGE}
    user: ${GESSP_OP_UID}:${GESSP_OP_GID}
    command: [/env/bin/bayes_daemon, --ensemble, --sensitivity, --outdir, /opt/data]
    networks:
      - portainer_web_proxy
    volumes:
      - /mnt/gessp/volcano/whakaaribn:/opt/data

  whakaaribnAPI:
    stop_grace_period: 60s
    deploy:
      update_config:
        order: start-first
    image: ${IMAGE}
    user: ${GESSP_OP_UID}:${GESSP_OP_GID}
    command: [/env/bin/whakaari_api, --rootdir, /opt/data]
    ports:
      - ${API_PORT}:8003
    volumes:
      - /mnt/gessp/volcano/whakaaribn:/opt/data
    networks:
      - portainer_web_proxy
        
networks:
  portainer_web_proxy:
    external: true